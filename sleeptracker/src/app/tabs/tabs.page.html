<!-- Bottom tab bar: the standard top-level navigation on iOS (and Android's bottom navigation bar). -->
<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="today-outline"></ion-icon>
      <ion-label>Today</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="log-sleep">
      <ion-icon name="moon-outline"></ion-icon>
      <ion-label>Sleep</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="log-sleepiness">
      <ion-icon name="cafe-outline"></ion-icon>
      <ion-label>Sleepiness</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="history">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <ion-label>History</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
