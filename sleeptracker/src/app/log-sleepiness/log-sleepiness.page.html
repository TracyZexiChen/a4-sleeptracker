<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleepiness</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleepiness</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="prompt ion-padding-horizontal">
    <p>RIGHT NOW</p>
    <h1>How sleepy are you?</h1>
    <span>Choose the description that feels closest.</span>
  </section>

  <app-sleepiness-form [value]="form" [maxDate]="maxDate" formId="log-sleepiness"></app-sleepiness-form>

</ion-content>

<!-- Fixed footer so the save button is always reachable with the thumb, without scrolling. -->
<ion-footer>
  <ion-toolbar class="save-bar">
    <ion-button expand="block" size="large" (click)="save()" [disabled]="!!errorMessage">
      {{ form.rating ? 'Save' : 'Pick a level' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
